[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesync"
version = "2.1.0"
description = "Production-grade AI Music Intelligence, Quantitative Modeling & Recommendation Platform"
authors = [{ name = "VibeSync AI Team" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "notebooks", "legacy", "backend/models", "backend/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/api/main.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
source = ["backend/src", "backend/api"]
omit = ["backend/tests/*", "backend/scripts/*", "notebooks/*", "legacy/*"]
