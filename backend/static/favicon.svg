<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c59aff" />
      <stop offset="50%" stop-color="#9547f7" />
      <stop offset="100%" stop-color="#00eefc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0e0e13" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="#15151c" stroke="url(#grad)" stroke-width="1.5" />
  <g filter="url(#glow)">
    <rect x="12" y="26" width="5" height="12" rx="2.5" fill="#c59aff" />
    <rect x="21" y="16" width="5" height="32" rx="2.5" fill="url(#grad)" />
    <rect x="30" y="10" width="5" height="44" rx="2.5" fill="#00eefc" />
    <rect x="39" y="18" width="5" height="28" rx="2.5" fill="url(#grad)" />
    <rect x="48" y="24" width="5" height="16" rx="2.5" fill="#c59aff" />
  </g>
</svg>
