name: VibeSync Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Code Linting
        run: |
          ruff check .

      - name: Execute Automated Pytest Suite
        env:
          ENVIRONMENT: testing
          SPOTIFY_CLIENT_ID: mock_client_id
          SPOTIFY_CLIENT_SECRET: mock_client_secret
        run: |
          pytest tests/ --cov=src --cov=api --cov-report=term-missing
