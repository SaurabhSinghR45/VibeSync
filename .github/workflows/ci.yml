name: VibeSync Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Build, Lint & Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Test Environment Directories
        run: |
          mkdir -p backend/data/raw backend/data/processed backend/models

      - name: Run Ruff Code Linting
        run: |
          ruff check .

      - name: Execute Automated Pytest Suite with Coverage
        env:
          ENVIRONMENT: testing
          SPOTIFY_CLIENT_ID: mock_client_id
          SPOTIFY_CLIENT_SECRET: mock_client_secret
          DATABASE_URL: sqlite:///backend/data/vibesync.db
        run: |
          pytest backend/tests/ --cov=backend/src --cov=backend/api --cov-report=term-missing
